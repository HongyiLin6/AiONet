[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aionet-research"
version = "0.2.1"
description = "Source-only independent reconstruction of AiONet experiments"
requires-python = ">=3.8,<3.12"
license = {text = "MIT"}
dependencies = ["numpy==1.23.4", "scipy==1.10.1", "scikit-learn==1.3.2", "joblib==1.4.2", "threadpoolctl==3.5.0"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
plot = ["matplotlib==3.5.3", "Pillow>=9,<11"]

[project.scripts]
aionet = "aionet.__main__:main"

[tool.setuptools.packages.find]
include = ["aionet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
